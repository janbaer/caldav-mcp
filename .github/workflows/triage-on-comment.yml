name: Triage on Comment

# Re-triages an unassigned issue after a maintainer's comment, in
# langmail/factory's triage-on-comment.yml, whose sync PRs move the pin.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  triage:
    uses: langmail/factory/.github/workflows/triage-on-comment.yml@e055871ce76db8aee6b7c3ac9030c91a90a51602 # v0.5.0
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
