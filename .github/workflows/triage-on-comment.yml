name: Triage on Comment

# Re-triages an unassigned issue after a maintainer's comment, in
# langmail/factory's triage-on-comment.yml, whose sync PRs move the pin.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  triage:
    uses: langmail/factory/.github/workflows/triage-on-comment.yml@9bf055020fc63aca401666c065a0c7537f0c6b1b # v0.4.0
    permissions:
      contents: read
      issues: write
      pull-requests: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
