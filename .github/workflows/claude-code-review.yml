name: Claude Code Review

# The review runs in langmail/factory's review.yml, whose sync PRs move the
# pin. What matters in this repo is in REVIEW.md.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions: {}

jobs:
  review:
    uses: langmail/factory/.github/workflows/review.yml@9bf055020fc63aca401666c065a0c7537f0c6b1b # v0.4.0
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
