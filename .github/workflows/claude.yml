name: Claude Code

# Runs an @claude request from an owner, member or collaborator in
# langmail/factory's claude.yml, whose sync PRs move the pin.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  claude:
    uses: langmail/factory/.github/workflows/claude.yml@b1b36dcbf1e05ddcc9fabd3a13f535c4f8b21c71 # v0.6.0
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
